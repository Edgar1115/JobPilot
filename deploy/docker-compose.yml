# JobPilot 基础设施 — docker compose
# 规格书 v2.0 第 59 章：Phase 0 启动 MySQL / Redis / RabbitMQ(management)
# 用法：docker compose -f deploy/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: jobpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jobpilot
      MYSQL_USER: jobpilot
      MYSQL_PASSWORD: jobpilot123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Phase 0.5：首次初始化数据卷时自动执行建表 + 种子数据（官方镜像以 utf8mb4 执行 .sql）
      - ./mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: jobpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: jobpilot
      RABBITMQ_DEFAULT_PASS: jobpilot123
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI（演示 Exchange / Queue / DLQ）
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
